name: es_manager
description: "ES Manager v2.0 - Clean & Professional CRM for Electricians"
publish_to: 'none'
version: 10.5.0+1050

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # UI & UX
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  lottie: ^3.1.2
  fl_chart: ^0.71.0
  table_calendar: ^3.1.2
  signature: ^5.5.0
  
  # Data & Local Storage
  shared_preferences: ^2.5.5
  intl: ^0.20.2
  json_annotation: ^4.9.0
  dio: ^5.8.0 # DODANE DO POBIERANIA APK
  
  # Firebase Core & Tools
  firebase_core: ^3.11.0
  cloud_firestore: ^5.6.3
  firebase_auth: ^5.5.1
  firebase_messaging: ^15.2.1
  firebase_storage: ^12.4.1
  
  # Multimedia & Native
  image_picker: ^1.2.2
  file_picker: ^8.3.7
  open_filex: ^4.7.0
  mobile_scanner: ^6.0.11
  flutter_local_notifications: ^18.0.1
  flutter_blue_plus: ^1.36.8
  google_mlkit_text_recognition: ^0.14.0
  torch_light: ^2.0.0
  light: ^5.0.0
  nfc_manager: ^4.2.1
  
  # Map & Location
  flutter_map: ^8.3.0
  latlong2: ^0.9.1
  geolocator: ^13.0.2
  permission_handler: ^11.3.1
  
  # Utility
  url_launcher: ^6.3.1
  share_plus: ^10.1.0
  path_provider: ^2.1.6
  pdf: ^3.10.8
  printing: ^5.11.1
  mailer: ^6.0.1 # DODANE DO WYSYŁKI E-MAIL PRZEZ SMTP
  record: ^7.1.1
  audioplayers: ^6.8.1
  reorderable_grid_view: ^2.2.8
  flutter_staggered_grid_view: ^0.7.0
  flutter_reorderable_grid_view: ^5.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  json_serializable: ^6.9.3

flutter:
  uses-material-design: true
  assets:
    - assets/
